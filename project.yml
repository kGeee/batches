# XcodeGen spec: run `xcodegen generate` to create Batches.xcodeproj
name: Batches
options:
  bundleIdPrefix: com.kevingeorge
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settingGroups:
  # Signing and version, shared by the app and its extension (an extension must match the app's version).
  signing:
    DEVELOPMENT_TEAM: 7CK43PG7GZ
    MARKETING_VERSION: "1.0"
    # Bump for every TestFlight upload.
    CURRENT_PROJECT_VERSION: "8"
  metalKernels:
    # Compile *.ci.metal as Core Image kernels
    MTL_COMPILER_FLAGS: "-fcikernel"
    MTLLINKER_FLAGS: "-cikernel"
targets:
  # Folders keep the app's first name, Strewn; the target, scheme and app are Batches.
  # Bundle IDs stay com.kevingeorge.strewn*, since App Store Connect is tied to them.
  Batches:
    type: application
    platform: iOS
    sources: [Strewn]
    resources:
      - path: Strewn/Resources/Looks
        buildPhase: resources
    dependencies:
      - package: Supabase
      - target: BatchesPhotoEdit
    # XcodeGen writes this file from the properties below on every generate, so edit them here.
    entitlements:
      path: Strewn/Resources/Strewn.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      groups: [metalKernels, signing]
      base:
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: Strewn/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kevingeorge.strewn
        TARGETED_DEVICE_FAMILY: "1"
        # Strewn/Resources/Assets.xcassets: one 1024 px icon, Xcode makes the other sizes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    configFiles:
      Debug: Strewn/Resources/Config.xcconfig
      Release: Strewn/Resources/Config.xcconfig

  # "Edit with Batches" inside the Photos app. Shares the editor, recipe and color pipeline.
  BatchesPhotoEdit:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/PhotoEdit
      - Strewn/Editing
      - Strewn/Camera/ColorPipeline
      - Strewn/Features/Editor
      - Strewn/Models/EditRecipe.swift
      - Strewn/App/Theme.swift
    resources:
      - path: Strewn/Resources/Looks
        buildPhase: resources
    settings:
      groups: [metalKernels, signing]
      base:
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: Extensions/PhotoEdit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kevingeorge.strewn.photoedit
        TARGETED_DEVICE_FAMILY: "1"
